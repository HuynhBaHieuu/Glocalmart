{% load static wms_tags %}<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>{% block title %}{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  body{font-family:Inter,Arial,sans-serif;color:#111;margin:0;background:#f3f4f6;font-size:13px}
  .page{max-width:820px;margin:24px auto;background:#fff;padding:40px 48px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0B4C34;padding-bottom:14px}
  .brand{font-weight:700;color:#0B4C34;font-size:16px}.muted{color:#6b7280;font-size:11.5px}
  h1{text-align:center;color:#0B4C34;letter-spacing:1px;margin:22px 0 4px;font-size:22px}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:18px 0}
  table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border:1px solid #d1d5db;padding:7px 8px}
  th{background:#0B4C34;color:#fff;font-weight:600;font-size:12px}td.r,th.r{text-align:right}
  tfoot td{font-weight:700;background:#EDF3EF}
  .sign{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:40px}
  .sign p{margin:0}.sign .sp{height:70px}
  .toolbar{max-width:820px;margin:16px auto 0;display:flex;gap:8px;justify-content:flex-end}
  .toolbar button,.toolbar a{background:#0B4C34;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 13px Inter;cursor:pointer;text-decoration:none}
  .toolbar a{background:#fff;color:#0B4C34;border:1px solid #0B4C34}
  .stamp{display:inline-block;border:2px solid;border-radius:6px;padding:2px 10px;font-weight:700;transform:rotate(-4deg)}
  @media print{body{background:#fff}.page{box-shadow:none;margin:0;max-width:none;padding:0}.toolbar{display:none}}
</style></head>
<body>
<div class="toolbar"><a href="javascript:history.back()">← Quay lại</a><button onclick="window.print()">In phiếu / Lưu PDF</button></div>
<div class="page">
  <div class="head">
    <div><div class="brand">G'LOCAL MART &amp; CAFE</div><div class="muted">Kho trung tâm · Hà Nội</div></div>
    <div class="muted" style="text-align:right">In lúc: {{ now|dt }}<br>Người in: {{ request.user.ho_ten }}</div>
  </div>
  {% block body %}{% endblock %}
</div>
<script>if (new URLSearchParams(location.search).get('auto')) window.print();</script>
</body></html>
